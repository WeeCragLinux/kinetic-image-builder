description: Terra repositories (mangohud, gamescope and other Terra packages come from these)
packages: []
groups: []
remove: []
repos:
  copr: []
  rpm_urls: []
  apt_lines: []
  # Bazzite already installs terra.repo / terra-extras.repo but leaves them
  # disabled. dcli-bootc's `enable` emits:
  #   sed -i 's/enabled=0/enabled=1/' /etc/yum.repos.d/<name>.repo
  # (Do NOT use `dnf install --repofrompath 'terra,...'` here — Bazzite already
  # defines a repo with id "terra", and dnf5 fails with "Id is present more than
  # once in the configuration".)
  enable:
    - terra
    - terra-extras
  import_keys: []
remote_rpms: []
local_rpms: []
appimages: []
flatpak_remotes: []
flatpaks: []
remove_flatpaks: []
user_flatpak_remotes: []
user_flatpaks: []
user_remove_flatpaks: []
files: []
services: []
first_boot_services: []
scripts: {}
depends: []
