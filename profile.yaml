name: kineticos-plus
base_image: ghcr.io/theblack-don/kineticos:default
# Experimental, very early, and not recommended for normal use:
# ghcr.io/theblack-don/kineticos:deck
nvidia_base_image: null
default_tag: latest
# Keep every module listed here so the configurator can offer app/removal choices.
# Removals and app modules stay disabled until the user selects choices.
# Removals is listed first so it runs before base and app modules when selected.
# Base and RPMFusion start enabled; the configurator can offer to disable
# RPMFusion when no selected app needs it.
enabled_modules:
#- removals
- base
- rpmfusion
#- mangohud
#- browsers
#- content
#- file-managers
#- gaming
#- comms
#- terminals
#- text-editors
#- screenshot-tools
#- dev
#- lgl-tools
package_manager: dnf
dotfiles: []
