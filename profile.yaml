name: kineticos-plus
base_image: ghcr.io/theblack-don/kineticos:default
# Experimental, very early, and not recommended for normal use:
# ghcr.io/theblack-don/kineticos:deck
nvidia_base_image: null
default_tag: latest
# Keep every module listed here so the configurator can offer its apps.
# App modules stay disabled until the user selects apps from their tab.
# Removals is listed first. Base, RPMFusion, and Terra also start enabled;
# the configurator can offer to disable either repo module when unneeded.
enabled_modules:
- removals
- base
- rpmfusion
- terra
#- browsers
#- content
#- file-managers
#- gaming
#- comms
#- terminals
#- text-editors
#- screenshot-tools
#- dev
#- lgl-tools
package_manager: dnf
dotfiles: []
