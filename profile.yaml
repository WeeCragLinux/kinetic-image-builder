name: kineticos-plus
base_image: ghcr.io/theblack-don/kineticos:default
# Experimental, very early, and not recommended for normal use:
# ghcr.io/theblack-don/kineticos:deck
nvidia_base_image: null
default_tag: latest
# Keep every module listed here so the configurator can offer its apps.
# App modules stay disabled until the user selects apps from their tab.
# RPMFusion and Terra start enabled; the configurator can offer to disable
# either at the end when none of the selected apps need it.
enabled_modules:
- base
- rpmfusion
- terra
#- browsers
#- content
#- gaming
#- comms
#- terminals
#- dev
#- lgl-tools
package_manager: dnf
dotfiles: []
